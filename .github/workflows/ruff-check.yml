
name: Ruff Check

on:
  push:
    branches: [ "*" ]
  pull_request:
    paths:
      - "nonebot_plugin_whateat_pic/**"


jobs:
  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Ruff Lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.1"
